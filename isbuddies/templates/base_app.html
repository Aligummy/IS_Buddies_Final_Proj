<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IS Buddies{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app">
    <div class="sb">
      <b>IS Buddies Supplies</b>
      <i>{{ current_user.role_label }}</i>
      {% for endpoint, icon, label in nav_items %}
        <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} class="on"{% endif %}>{{ icon }} {{ label }}</a>
      {% endfor %}
      <a href="{{ url_for('auth.logout') }}" style="margin-top:auto">🚪 Logout</a>
    </div>
    <div class="mn">
      {% for m in get_flashed_messages() %}<p class="note flash-msg">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
    </div>
  </div>
{% block scripts %}{% endblock %}
</body>
</html>
