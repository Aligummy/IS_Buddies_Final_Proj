{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'dashboard' %}
    <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
  {% elif name == 'inventory' %}
    <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
  {% elif name == 'sales' %}
    <circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
    <path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5"/>
  {% elif name == 'history' %}
    <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
  {% elif name == 'users' %}
    <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/>
    <path d="M20 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>
  {% elif name == 'suppliers' %}
    <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5"/><path d="M9 9h.01M15 9h.01"/>
  {% elif name == 'customers' %}
    <circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2"/><path d="M17 11a4 4 0 0 0 0-7M21 21v-2a6 6 0 0 0-3-5.2"/>
  {% elif name == 'reports' %}
    <path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/><path d="M16 6h4v4"/>
  {% elif name == 'knowledge' %}
    <path d="M9 18h6M10 22h4"/><path d="M8.2 14.5A7 7 0 1 1 15.8 14.5c-1 .7-1.3 1.5-1.3 2.5h-5c0-1-.3-1.8-1.3-2.5Z"/>
  {% elif name == 'logout' %}
    <path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
  {% elif name == 'package' %}
    <path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>
  {% elif name == 'trend' %}
    <path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>
  {% elif name == 'alert' %}
    <path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/>
    <path d="M12 9v4M12 17h.01"/>
  {% elif name == 'receipt' %}
    <path d="M4 3h16v18l-4-2-4 2-4-2-4 2V3Z"/><path d="M8 8h8M8 12h8M8 16h4"/>
  {% elif name == 'menu' %}
    <path d="M4 6h16M4 12h16M4 18h16"/>
  {% endif %}
</svg>
{%- endmacro %}
